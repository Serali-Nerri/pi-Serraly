# Historical module CI reference; GitHub does not discover nested workflows.
# The repository root owns actual CI, dependency installation and release gates.
name: Workspace shell gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Pi 0.99.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install without dependency lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Clean compiled runtime and closure
        run: npm run build:runtime --workspace pi-background-shell
      - name: Read-only documentation/schema gate
        run: npm run docs:verify --workspace pi-background-shell
      - name: Typecheck, unit, SDK, RPC, component and package
        run: npm test --workspace pi-background-shell
        env:
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
          CI: '1'
      - name: Deterministic scripted-provider loop (no paid calls)
        run: npm run test:agent-loop --workspace pi-background-shell
        env:
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
          CI: '1'
      - name: Package payload
        run: npm run payload:check --workspace pi-background-shell
      - name: Prepack dry run
        run: npm run pack:dry-run --workspace pi-background-shell
  windows:
    name: Native Windows tree and quoting checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Locate Git Bash for explicit Bash shell cases
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path $bash)) { throw "Git Bash not found: $bash" }
          "PI_BG_TEST_BASH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm run test:windows --workspace pi-background-shell
        env:
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
          CI: '1'
